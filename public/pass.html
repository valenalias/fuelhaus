<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google" content="notranslate">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#FBF7F5">
  <title>FuelHaus — First Week Pass</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;800&family=Lora:ital,wght@1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    /* Paleta del First Week Pass impreso (deck de marca), no la de la web: la
       pagina es la extension digital de la tarjeta. --sage-ink es el sage un
       poco mas oscuro, solo para texto chico (el sage pleno da 3:1 sobre crema). */
    :root {
      --cream:    #FBF7F5;
      --sage:     #73976F;
      --sage-ink: #577752;
      --deep:     #2B3D26;
      --line:     rgba(115, 151, 111, 0.55);
      --font-sans:  'Be Vietnam Pro', system-ui, -apple-system, sans-serif;
      --font-serif: 'Lora', Georgia, 'Times New Roman', serif;
    }

    html { background: var(--cream); }
    body {
      font-family: var(--font-sans);
      background: var(--cream);
      color: var(--deep);
      min-height: 100vh;
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      max-width: 440px;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      padding: 28px 24px 24px;
      display: flex;
      flex-direction: column;
    }

    /* cabecera */
    .top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }
    .wordmark { display: inline-flex; align-items: baseline; gap: 1px; font-size: 26px; line-height: 1; color: var(--sage); }
    .wordmark em { font-family: var(--font-serif); font-style: italic; font-weight: 400; letter-spacing: -0.5px; }
    .wordmark strong { font-weight: 800; letter-spacing: -0.5px; }
    .where { font-size: 11px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--sage-ink); }

    .eyebrow { margin-top: 28px; font-family: var(--font-serif); font-style: italic; font-size: 24px; color: var(--sage-ink); }

    h1 {
      margin-top: 10px;
      font-weight: 800;
      font-size: clamp(34px, 10.6vw, 46px);
      line-height: 1.08;
      letter-spacing: -0.03em;
      color: var(--deep);
    }
    h1 span { display: block; color: var(--sage); }

    /* el credito: panel con "talon" punteado, como la tarjeta */
    .credit { margin-top: 28px; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
    .credit-top { padding: 18px 20px 16px; }
    .amount { font-weight: 800; font-size: clamp(88px, 28vw, 118px); line-height: 0.92; letter-spacing: -0.045em; color: var(--deep); }
    .amount-label { margin-top: 6px; font-weight: 500; font-size: 20px; letter-spacing: -0.01em; color: var(--deep); }
    .credit-stub { padding: 14px 20px 16px; border-top: 1.5px dashed var(--line); }
    .ready { font-weight: 500; font-size: 15px; color: var(--deep); }
    .applied { margin-top: 4px; font-family: var(--font-serif); font-style: italic; font-size: 14px; color: var(--sage-ink); }
    .applied[hidden] { display: none; }
    .code {
      margin-top: 12px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 9px 14px;
      border: 1px solid var(--sage);
      border-radius: 8px;
    }
    .code-label { font-size: 10px; font-weight: 500; letter-spacing: 0.14em; color: var(--sage-ink); }
    .code-value { font-weight: 800; font-size: 17px; letter-spacing: 0.04em; color: var(--deep); user-select: all; -webkit-user-select: all; }

    /* valor */
    .value { margin-top: 26px; }
    .protein { font-weight: 800; font-size: 28px; letter-spacing: -0.03em; line-height: 1; color: var(--deep); }
    .protein em { margin-left: 6px; font-family: var(--font-serif); font-style: italic; font-weight: 400; font-size: 15px; letter-spacing: 0; color: var(--sage-ink); }
    .how { margin-top: 10px; font-size: 11px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--sage-ink); }

    /* CTA */
    .cta-block { margin-top: auto; padding-top: 30px; }
    .cta {
      display: block; width: 100%;
      padding: 18px 20px;
      text-align: center; text-decoration: none;
      font-family: var(--font-sans); font-weight: 800; font-size: 14px; letter-spacing: 0.16em;
      color: var(--cream); background: var(--deep);
      border-radius: 12px;
      transition: background 0.18s ease, transform 0.18s ease;
    }
    .cta:hover { background: #1f2c1b; }
    .cta:active { transform: scale(0.99); }
    .cta:focus-visible { outline: 3px solid var(--sage); outline-offset: 3px; }
    .fine { margin-top: 12px; text-align: center; font-family: var(--font-serif); font-style: italic; font-size: 14px; color: var(--sage-ink); }

    footer { margin-top: 26px; padding-top: 14px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; font-size: 11px; font-weight: 500; letter-spacing: 0.12em; color: var(--sage-ink); }

    @media (prefers-reduced-motion: no-preference) {
      .wrap > * { animation: rise 0.5s ease both; }
      .wrap > *:nth-child(2) { animation-delay: 0.05s; }
      .wrap > *:nth-child(3) { animation-delay: 0.1s; }
      .wrap > *:nth-child(4) { animation-delay: 0.16s; }
      .wrap > *:nth-child(5) { animation-delay: 0.22s; }
      .wrap > *:nth-child(6) { animation-delay: 0.28s; }
      @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    }

    @media (max-height: 700px) {
      .eyebrow { margin-top: 20px; }
      .credit { margin-top: 20px; }
      .value { margin-top: 18px; }
      .cta-block { padding-top: 22px; }
    }

    /* ── Tablet (640–1023px): misma columna, mas ancha y con tipografia mas grande.
          Todo lo de abajo vive en min-width, asi que mobile queda intacto. ───── */
    @media (min-width: 640px) {
      .wrap { max-width: 640px; padding: 48px 40px 36px; }
      .wordmark { font-size: 30px; }
      .eyebrow { margin-top: 44px; font-size: 28px; }
      h1 { font-size: clamp(52px, 8vw, 64px); }
      .credit { margin-top: 40px; }
      .credit-top { padding: 26px 28px 22px; }
      .amount { font-size: clamp(110px, 17vw, 132px); }
      .amount-label { font-size: 22px; }
      .credit-stub { padding: 18px 28px 22px; }
      .ready { font-size: 16px; }
      .applied { font-size: 15px; }
      .value { margin-top: 36px; }
      .protein { font-size: 32px; }
      .protein em { font-size: 17px; }
      .cta-block { padding-top: 40px; max-width: 420px; }
      .fine { font-size: 15px; }
      footer { margin-top: 40px; }
    }

    /* ── Desktop (1024px+): composicion horizontal en dos columnas. El DOM no
          cambia: se reordena con grid. Izquierda = marca + headline; derecha = el
          credito; debajo, una franja con el valor, el CTA y el pie. ─────────── */
    @media (min-width: 1024px) {
      .wrap {
        max-width: 1160px;
        padding: 56px 56px 40px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 492px;     /* 420 de credito + 72 de aire */
        grid-template-rows: auto 1fr 1fr auto auto;
        grid-template-areas:
          "top     ."
          "eyebrow credit"
          "h1      credit"
          "value   cta"
          "foot    foot";
      }
      .top      { grid-area: top; }
      .eyebrow  { grid-area: eyebrow; align-self: end; margin-top: 0; font-size: 30px; }
      h1        { grid-area: h1; align-self: start; margin-top: 14px; font-size: clamp(48px, 4.5vw, 64px); }
      h1 span   { white-space: nowrap; }

      .credit   { grid-area: credit; align-self: center; margin: 0 0 0 72px; }
      .credit-top  { padding: 28px 30px 24px; }
      .amount      { font-size: 132px; }
      .amount-label{ font-size: 22px; }
      .credit-stub { padding: 18px 30px 24px; }

      /* franja inferior: una sola linea fina que cruza las dos columnas */
      .value {
        grid-area: value; align-self: stretch;
        margin-top: 56px; padding-top: 28px;
        border-top: 1px solid var(--line);
      }
      .cta-block {
        grid-area: cta; align-self: stretch;
        max-width: none; margin-top: 56px; padding: 28px 0 0 72px;
        border-top: 1px solid var(--line);
      }
      .cta-block .cta { max-width: 420px; }
      .cta-block .fine { max-width: 420px; }
      footer { grid-area: foot; margin-top: 36px; padding-top: 0; border-top: 0; }
    }

    /* pantallas muy altas: que la composicion no quede pegada arriba */
    @media (min-width: 1024px) and (min-height: 1000px) {
      .wrap { padding-top: 72px; padding-bottom: 56px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="top">
      <span class="wordmark" aria-label="FuelHaus"><em>fuel</em><strong>haus</strong></span>
      <span class="where">Miami</span>
    </header>

    <p class="eyebrow">First Week Pass</p>
    <h1>don’t let food <span>be the hard part.</span></h1>

    <section class="credit" aria-label="Your credit">
      <div class="credit-top">
        <div class="amount">$20</div>
        <div class="amount-label">meal credit</div>
      </div>
      <div class="credit-stub">
        <p class="ready">Your $20 FuelHaus credit is ready.</p>
        <p class="applied" id="applied" hidden>Your $20 credit will be applied at checkout.</p>
        <div class="code">
          <span class="code-label">CODE</span>
          <span class="code-value">FIRSTWEEK20</span>
        </div>
      </div>
    </section>

    <section class="value">
      <p class="protein">50g+<em>protein per meal</em></p>
      <p class="how">Choose your meals · Weekly delivery</p>
    </section>

    <div class="cta-block">
      <a class="cta" href="/?utm_source=firstweekpass&amp;utm_medium=card&amp;utm_campaign=firstweek20#planes">BUILD YOUR WEEK</a>
      <p class="fine">First order only.</p>
    </div>

    <footer>
      <span>@fuelhausmeals</span>
      <span>MIAMI</span>
    </footer>
  </main>

  <script>
    // Dos cosas, ambas con try/catch: la pagina tiene que funcionar igual sin
    // almacenamiento (modo privado, bloqueado). El codigo sigue visible arriba.
    (function () {
      var PROMO_KEY = 'fh_promo';

      // 1) Idioma: la tarjeta esta en ingles, asi que si la persona nunca eligio
      //    idioma el sitio sigue en ingles. Una preferencia previa se respeta.
      try {
        if (!localStorage.getItem('fh_lang')) localStorage.setItem('fh_lang', 'en');
      } catch (e) {}

      // 2) Guardar el cupon 30 dias para aplicarlo en el paso de pago (home.html).
      //    La linea "will be applied" solo se muestra si de verdad quedo guardado.
      try {
        var promo = { code: 'FIRSTWEEK20', source: 'firstweekpass', ts: Date.now() };
        localStorage.setItem(PROMO_KEY, JSON.stringify(promo));
        var back = JSON.parse(localStorage.getItem(PROMO_KEY) || 'null');
        if (back && back.code === promo.code) document.getElementById('applied').hidden = false;
      } catch (e) {}
    })();
  </script>
</body>
</html>
